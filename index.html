<style>
  :root{

    --red:oklch(0.7 0.19 22); --green:oklch(0.75 0.15 150); --yellow:oklch(0.85 0.15 90);
  }
  html.light{
    --bg:oklch(0.98 0.006 240); --fg:oklch(0.22 0.04 255); --card:oklch(1 0 0);

  }
  html,body{background:var(--bg);color:var(--fg);font-family:Archivo,system-ui,sans-serif}
  .leaflet-container{background:var(--muted)!important;font-family:Archivo,sans-serif}
  html.mow{--orange:oklch(0.74 0.17 140);--ice:oklch(0.86 0.09 155)}
  html.light.mow{--orange:oklch(0.6 0.16 145);--ice:oklch(0.48 0.12 155)}
  .appt{border-radius:.6rem;padding:.45rem .6rem;font-size:.78rem;text-align:left;width:100%;border-left:4px solid}
  .appt.red{background:oklch(0.7 0.19 22 / 16%);border-color:var(--red)}
  .appt.green{background:oklch(0.75 0.15 150 / 16%);border-color:var(--green)}
  .seg{display:inline-flex;border:1px solid var(--input);border-radius:.75rem;overflow:hidden}
  .seg button{padding:.6rem 1rem;font-weight:600;font-size:.9rem}
  .seg button.on{background:var(--orange);color:oklch(0.15 0.03 255)}
  .display{font-family:"Archivo Black",Archivo,sans-serif;letter-spacing:-.01em}
  .snow-bg{background:radial-gradient(ellipse at top right,color-mix(in oklab,var(--ice) 18%,transparent),transparent 60%),var(--bg)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:1rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:.75rem;font-weight:700;padding:0 1.25rem;transition:filter .15s,transform .15s}
  .btn-orange{background:var(--orange);color:oklch(0.15 0.03 255);box-shadow:0 10px 30px -10px color-mix(in oklab,var(--orange) 60%,transparent)}
  .btn-orange:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-ghost{border:1px solid var(--input);color:var(--fg)}
  .btn-ghost:hover{background:var(--muted)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .input{width:100%;min-height:48px;border-radius:.75rem;background:var(--bg);color:var(--fg);border:1px solid var(--input);padding:.75rem 1rem;font-size:1rem}
  .input:focus{outline:2px solid var(--orange);outline-offset:1px}
  .ice{color:var(--ice)} .orange{color:var(--orange)} .muted{color:var(--mfg)}
  .chip{border:1px solid var(--input);border-radius:999px;padding:.4rem .9rem;font-size:.85rem;white-space:nowrap}
  .chip.on{background:var(--orange);color:oklch(0.15 0.03 255);border-color:var(--orange);font-weight:700}
  .tab{padding:.75rem 1rem;border-radius:.75rem;font-weight:600;white-space:nowrap;color:var(--mfg)}
  .tab.on{background:var(--muted);color:var(--fg)}
  .choice{border:2px solid var(--input);border-radius:1rem;padding:1.25rem;text-align:left;width:100%}
  .choice.on{border-color:var(--orange);background:color-mix(in oklab,var(--orange) 10%,var(--card))}
  .todo{border:1px dashed var(--yellow);color:var(--yellow);border-radius:.75rem;padding:.6rem .8rem;font-size:.8rem}
  .st-New{background:oklch(0.85 0.08 225 / 20%);color:var(--ice)}
  .st-Quoted{background:oklch(0.85 0.15 90 / 20%);color:var(--yellow)}
  .st-DepositPaid,.st-Booked{background:oklch(0.75 0.15 150 / 20%);color:var(--green)}
  .st-Done{background:oklch(0.78 0.03 235 / 20%);color:var(--mfg)}
  .st-Cancelled{background:oklch(0.7 0.19 22 / 20%);color:var(--red)}
  .pill{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
  .scroll-x{overflow-x:auto;scrollbar-width:none} .scroll-x::-webkit-scrollbar{display:none}
  dialog::backdrop{background:rgb(0 0 0 / .6)}
</style>

function captureRef(){
  const q=location.hash.split("?")[1]||location.search.slice(1);
  const ref=new URLSearchParams(q).get("ref");
  if(ref){try{localStorage.setItem("snowline_ref",JSON.stringify({code:ref.toUpperCase(),exp:Date.now()+60*864e5}))}catch(e){}}
}
function getRef(){try{const r=JSON.parse(localStorage.getItem("snowline_ref"));if(r&&r.exp>Date.now())return r.code}catch(e){}return ""}

/* ============ ROUTER ============ */
window.addEventListener("hashchange",route);
function route(){
  captureRef();
  const h=(location.hash||"#/").slice(1).split("?")[0];
  window.scrollTo(0,0);
  if(h.startsWith("/mow")){setBrand("mow");return landing()}
  if(!h.startsWith("/dashboard")&&!h.startsWith("/q/")&&h!=="/login"&&h!=="/signup"&&h!=="/start"&&h!=="/kids"&&!h.startsWith("/blog"))setBrand("plow");
  if(h.startsWith("/q/")) return quotePage();
  if(h==="/start") return startPage();
  if(h==="/kids") return kidsPage();
  if(h==="/blog") return blogIndex();
  if(h.startsWith("/blog/")) return blogPost(h.split("/")[2]);
  if(h==="/login") return loginPage("login");
  if(h==="/signup") return loginPage("signup");
  if(h.startsWith("/dashboard")) return dashboard(h.split("/")[2]||"jobs");
  if(h==="/privacy"||h==="/terms") return comingSoon(h==="/privacy"?"Privacy Policy":"Terms of Service");
  return landing();
}

 {slug:"ein",tag:"Getting set up",title:"EINs and business texting, explained in plain English",excerpt:"Why carriers ask who you are before your business can text customers, and what to do if you don't have an EIN yet.",
  body:`<p>Every business that texts customers in the U.S. has to register with the cell phone carriers first. It's how they keep spam off people's phones. Calls don't need it, which is why your business line can take calls the same day it's set up.</p>
  <h3>What's an EIN?</h3><p>An Employer Identification Number is a free ID number from the IRS for your business, like a Social Security number for your company. You don't need employees to get one. Most people can apply online in about 10 minutes.</p>
  <h3>No EIN? You still have options</h3><p>We can register you as a sole proprietor using your own information. You get one business number and a lower daily text limit, which is plenty for most operators starting out. You can switch to a standard registration later.</p>

function dm(){DB.pricing.demand=DB.pricing.demand||{on:false,every:5,amount:5,kind:"flat",cap:20,applies:["base","walkway","salt"],storm:0};return DB.pricing.demand}
function todaysJobs(){const t=new Date().toDateString();return DB.jobs.filter(j=>new Date(j.created).toDateString()===t&&j.status!=="Cancelled").length}
function demandBump(lines){const d=dm();let bump=0;if(d.on){const steps=Math.floor(todaysJobs()/Math.max(1,d.every));const app=lines.filter(l=>d.applies.includes(l[2]));
  if(steps>0&&app.length){bump=d.kind==="flat"?d.amount*steps*app.length:app.reduce((s,l)=>s+Number(l[1]),0)*d.amount/100*steps;bump=Math.min(bump,d.cap)}}
  if(d.emergency)return 0;const total=lines.reduce((s,l)=>s+Number(l[1]),0);return Math.round(Math.min(bump+Number(d.storm||0),total*0.15)*100)/100}

    <div><div class="mb-1">Apply to:</div><div class="flex flex-wrap gap-2">${[["base","Driveway price"],["walkway","Walkway"],["salt","Salt / de-ice"],["rush","Rush fee"]].map(([k,l])=>`<button class="chip ${d.applies.includes(k)?"on":""}" onclick="const a=dm().applies;a.includes('${k}')?a.splice(a.indexOf('${k}'),1):a.push('${k}');save();tabPricing()">${l}</button>`).join("")}</div></div>

    <p class="muted text-xs">Every job is capped at 15% above your regular price, so you're never accused of gouging.</p>

   <div class="flex justify-between items-center gap-3 mt-4 p-3 rounded-xl" style="border:1px solid var(--yellow)"><div class="text-sm"><b>Declared snow emergency?</b><br><span class="muted text-xs">Many states limit price increases during a declared emergency. Turning this on pauses demand pricing and storm boosts until you turn it off.</span></div><button class="chip ${d.emergency?"on":""}" onclick="dm().emergency=!dm().emergency;save();tabPricing()">${d.emergency?"Paused":"Normal"}</button></div></div>`}

  try{new QRCode(document.getElementById("qr"),{text:url,width:220,height:220})}catch(e){$("#qr").textContent="QR code loads here"}

function dlQR(){const c=document.querySelector("#qr canvas"),i=document.querySelector("#qr img");const a=document.createElement("a");a.download="plowcall-qr.png";a.href=c?c.toDataURL("image/png"):(i?i.src:"");a.click()}
/* ---------- SERVICE AREAS (map) ---------- */
const STATES={OH:"Ohio",NY:"New York",PA:"Pennsylvania",MI:"Michigan",IN:"Indiana",IL:"Illinois",WI:"Wisconsin",MN:"Minnesota",MA:"Massachusetts",NH:"New Hampshire",VT:"Vermont",ME:"Maine",CT:"Connecticut",NJ:"New Jersey"};
let ZIPGEO=null,MAP=null,ZLAYER=null,LASSO=false,ZIDX={};
async function loadZips(){if(ZIPGEO)return ZIPGEO;const r=await fetch("oh-zips.json");ZIPGEO=await r.json();ZIPGEO.features.forEach(f=>ZIDX[f.properties.zip]=f);return ZIPGEO}
function zipStyle(z){const on=DB.operator.service_zip_codes.includes(z);const cs=getComputedStyle(document.documentElement);
  return {color:on?cs.getPropertyValue("--orange"):cs.getPropertyValue("--ice"),weight:on?2:.6,opacity:on?1:.55,fillColor:cs.getPropertyValue("--orange"),fillOpacity:on?.45:.02}}
function tabAreas(){
  const o=DB.operator;
  $("#tab").innerHTML=`<div class="grid lg:grid-cols-[1fr_320px] gap-4">
   <div class="card p-3 sm:p-4">
    <div class="flex flex-wrap gap-2 items-center">
      <select id="stSel" class="input !w-auto !min-h-[44px]" onchange="if(this.value!=='OH'){toast(STATES[this.value]+' map loads in the full app. Preview has Ohio only.');this.value='OH'}">${Object.entries(STATES).map(([k,v])=>`<option value="${k}" ${k===o.state?"selected":""}>${v}</option>`).join("")}</select>
      <div class="relative flex-1 min-w-[200px]"><input id="zsearch" class="input !min-h-[44px]" placeholder="Search a city or ZIP code" autocomplete="off" oninput="zipSearch(this.value)"><div id="zres" class="absolute z-[1000] left-0 right-0 mt-1 card hidden max-h-72 overflow-auto"></div></div>
    </div>
    <div class="flex flex-wrap gap-2 mt-3">
      <button id="lassoBtn" class="btn btn-ghost !min-h-[42px] text-sm" onclick="toggleLasso()">✏️ Circle an area</button>
      <button class="btn btn-ghost !min-h-[42px] text-sm" onclick="fitSelected()">Zoom to my areas</button>
      <button class="btn btn-ghost !min-h-[42px] text-sm" onclick="if(confirm('Remove every ZIP code from your service area?')){DB.operator.service_zip_codes=[];save();restyle();areaList()}">Clear all</button>
    </div>
    <p id="mapHint" class="muted text-xs mt-2">Tap a ZIP on the map to add or remove it. Pinch or scroll to zoom.</p>
    <div id="map" class="mt-2 rounded-xl overflow-hidden" style="height:min(62vh,560px)"></div>
   </div>
   <div class="card p-4" id="areaList"></div>
  </div>`;
  areaList();
  loadZips().then(drawMap).catch(()=>{$("#map").innerHTML=`<div class="p-6 muted text-sm">Map data couldn't load. Open the preview from its web link, not as a downloaded file.</div>`});
}
function drawMap(g){
  if(MAP){try{MAP.remove()}catch(e){}MAP=null}
  MAP=L.map("map",{preferCanvas:true,zoomSnap:.5});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/"+(document.documentElement.classList.contains("light")?"light_all":"dark_all")+"/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap &copy; CARTO",maxZoom:16}).addTo(MAP);
  ZLAYER=L.geoJSON(g,{style:f=>zipStyle(f.properties.zip),onEachFeature:(f,l)=>{
    l.bindTooltip(`<b>${f.properties.zip}</b> · ${f.properties.city}`,{sticky:true});
    l.on("click",()=>{if(LASSO)return;toggleZip(f.properties.zip)});
  }}).addTo(MAP);
  DB.operator.service_zip_codes.length?fitSelected():MAP.fitBounds(ZLAYER.getBounds());
}
function restyle(){if(ZLAYER)ZLAYER.eachLayer(l=>l.setStyle(zipStyle(l.feature.properties.zip)))}
function toggleZip(z,force){const s=DB.operator.service_zip_codes,has=s.includes(z),want=force===undefined?!has:force;
  if(want&&!has)s.push(z);if(!want&&has)s.splice(s.indexOf(z),1);save();restyle();areaList()}
function fitSelected(){if(!ZLAYER)return;const b=L.latLngBounds([]);ZLAYER.eachLayer(l=>{if(DB.operator.service_zip_codes.includes(l.feature.properties.zip))b.extend(l.getBounds())});b.isValid()?MAP.fitBounds(b,{padding:[20,20]}):MAP.fitBounds(ZLAYER.getBounds())}
function zipSearch(q){
  const box=$("#zres");q=q.trim().toLowerCase();if(!q||!ZIPGEO){box.classList.add("hidden");return}
  const feats=ZIPGEO.features;let html="";
  if(/^\d{3,5}$/.test(q)){feats.filter(f=>f.properties.zip.startsWith(q)).slice(0,8).forEach(f=>{const p=f.properties,on=DB.operator.service_zip_codes.includes(p.zip);
    html+=`<div class="flex justify-between items-center gap-2 px-3 py-2 border-b" style="border-color:var(--border)"><button class="text-left flex-1" onclick="zoomZip('${p.zip}')"><b>${p.zip}</b> <span class="muted">${p.city}</span></button><button class="chip ${on?"on":""}" onclick="toggleZip('${p.zip}');zipSearch($('#zsearch').value)">${on?"Added":"Add"}</button></div>`})}
  else{const cities={};feats.forEach(f=>{const c=f.properties.city;if(c.toLowerCase().includes(q))(cities[c]=cities[c]||[]).push(f.properties.zip)});
    Object.entries(cities).sort((a,b)=>a[0].toLowerCase().indexOf(q)-b[0].toLowerCase().indexOf(q)||b[1].length-a[1].length).slice(0,8).forEach(([c,zs])=>{const n=zs.filter(z=>DB.operator.service_zip_codes.includes(z)).length;
    html+=`<div class="px-3 py-2 border-b" style="border-color:var(--border)"><div class="flex justify-between items-center gap-2"><button class="text-left" onclick="zoomCity('${c}')"><b>${c}</b> <span class="muted text-xs">${zs.length} ZIP${zs.length>1?"s":""}${n?` · ${n} added`:""}</span></button>
    <button class="chip ${n===zs.length?"on":""}" onclick="cityAll('${c}',${n!==zs.length})">${n===zs.length?"All added":"Add all"}</button></div>
    <div class="flex flex-wrap gap-1 mt-2">${zs.map(z=>`<button class="chip !py-1 !px-2 text-xs ${DB.operator.service_zip_codes.includes(z)?"on":""}" onclick="toggleZip('${z}');zipSearch($('#zsearch').value)">${z}</button>`).join("")}</div></div>`})}
  box.innerHTML=html||`<div class="px-3 py-3 muted text-sm">No match in ${STATES[DB.operator.state]}.</div>`;box.classList.remove("hidden");
}
function zoomZip(z){const l=ZLAYER&&ZLAYER.getLayers().find(l=>l.feature.properties.zip===z);if(l){MAP.fitBounds(l.getBounds(),{maxZoom:13});l.openTooltip()}$("#zres").classList.add("hidden")}
function zoomCity(c){const b=L.latLngBounds([]);ZLAYER.eachLayer(l=>{if(l.feature.properties.city===c)b.extend(l.getBounds())});if(b.isValid())MAP.fitBounds(b,{padding:[20,20]});$("#zres").classList.add("hidden")}
function cityAll(c,add){ZIPGEO.features.filter(f=>f.properties.city===c).forEach(f=>toggleZip(f.properties.zip,add));zipSearch($("#zsearch").value);toast(add?`Added all of ${c}`:`Removed ${c}`)}
function toggleLasso(){LASSO=!LASSO;$("#lassoBtn").classList.toggle("btn-orange",LASSO);$("#lassoBtn").classList.toggle("btn-ghost",!LASSO);
  $("#mapHint").textContent=LASSO?"Draw a circle around the area with your finger or mouse. Every ZIP inside gets added.":"Tap a ZIP on the map to add or remove it. Pinch or scroll to zoom.";
  if(!MAP)return;LASSO?MAP.dragging.disable():MAP.dragging.enable();
  const el=MAP.getContainer();el.style.touchAction=LASSO?"none":"";
  if(LASSO){let pts=[],line=null;
    el.onpointerdown=e=>{pts=[MAP.mouseEventToLatLng(e)];line=L.polyline(pts,{color:getComputedStyle(document.documentElement).getPropertyValue("--orange"),weight:3,dashArray:"6 6"}).addTo(MAP);el.setPointerCapture(e.pointerId)};
    el.onpointermove=e=>{if(!line)return;pts.push(MAP.mouseEventToLatLng(e));line.setLatLngs(pts)};
    el.onpointerup=()=>{if(!line)return;const poly=pts.map(p=>[p.lng,p.lat]);MAP.removeLayer(line);line=null;let n=0;
      if(poly.length>4)ZLAYER.eachLayer(l=>{const c=l.getBounds().getCenter();if(inPoly([c.lng,c.lat],poly)&&!DB.operator.service_zip_codes.includes(l.feature.properties.zip)){DB.operator.service_zip_codes.push(l.feature.properties.zip);n++}});
      save();restyle();areaList();toast(n?`Added ${n} ZIP code${n>1?"s":""}`:"No new ZIP codes inside that circle");toggleLasso()};
  }else{el.onpointerdown=el.onpointermove=el.onpointerup=null}
}
function inPoly(pt,vs){let x=pt[0],y=pt[1],inside=false;for(let i=0,j=vs.length-1;i<vs.length;j=i++){const xi=vs[i][0],yi=vs[i][1],xj=vs[j][0],yj=vs[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}return inside}
function areaList(){
  const s=DB.operator.service_zip_codes,by={};s.forEach(z=>{const c=ZIDX[z]?ZIDX[z].properties.city:"";(by[c]=by[c]||[]).push(z)});
  const el=$("#areaList");if(!el)return;
  el.innerHTML=`<h2 class="font-bold text-lg">Your service area</h2><p class="muted text-sm">${s.length} ZIP code${s.length===1?"":"s"} in ${STATES[DB.operator.state]}. Requests from anywhere else still come in, flagged "Outside area".</p>
  <div class="mt-4 grid gap-3">${Object.entries(by).sort().map(([c,zs])=>`<div><div class="text-sm font-bold">${c||"Loading..."}</div><div class="flex flex-wrap gap-1 mt-1">${zs.sort().map(z=>`<span class="chip !py-1 !px-2 text-xs flex items-center gap-1">${z}<button onclick="toggleZip('${z}')" class="muted">×</button></span>`).join("")}</div></div>`).join("")||`<p class="muted text-sm">Nothing yet. Search your city or circle an area on the map.</p>`}</div>`;
}

/* ---------- PARTNERS (call calendar) ---------- */
let weekStart=startOfWeek(new Date());
function startOfWeek(d){d=new Date(d);d.setHours(0,0,0,0);return d}
const fmtD=iso=>new Date(iso).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
const fmtT=iso=>new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const fmtDT=iso=>fmtD(iso)+" at "+fmtT(iso);
function apptTime(p){return p.status==="confirmed"?p.final:p.status==="reschedule_sent"?p.proposed:p.requested}
function apptColor(p){return p.status==="confirmed"?"green":"red"}
function apptLabel(p){return {requested:"Needs your answer",reschedule_sent:"New time sent, waiting on them",confirmed:"Confirmed",rejected:"Rejected"}[p.status]}

  </div>
  <div class="grid grid-cols-1 sm:grid-cols-7 gap-2 mt-4">${days.map(d=>{const items=live.filter(p=>new Date(apptTime(p)).toDateString()===d.toDateString()).sort((a,b)=>new Date(apptTime(a))-new Date(apptTime(b)));const today=d.toDateString()===new Date().toDateString();
    return `<div class="card p-2 min-h-[90px] ${items.length?"":"hidden sm:block"}" ${today?'style="border-color:var(--orange)"':""}><div class="text-xs font-bold ${today?"orange":"muted"} mb-2">${d.toLocaleDateString([], {weekday:"short",day:"numeric"})}</div>
    <div class="grid gap-1">${items.map(p=>`<button class="appt ${apptColor(p)}" onclick="openPartner(${p.id})"><b>${fmtT(apptTime(p))}</b><br>${p.company}</button>`).join("")}</div></div>`}).join("")}</div>
  ${live.filter(p=>{const t=new Date(apptTime(p));return t>=days[0]&&t<new Date(days[6].getTime()+864e5)}).length?"":`<p class="muted text-sm mt-3">No calls this week.</p>`}
  <h2 class="font-bold text-lg mt-8">Needs your answer <span class="pill" style="background:oklch(0.7 0.19 22 / 20%);color:var(--red)">${open.length}</span></h2>
  <div class="grid gap-2 mt-3">${open.map(p=>`<button class="card p-4 text-left flex justify-between gap-3 items-center" onclick="openPartner(${p.id})"><div><div class="font-bold">${p.company}</div><div class="muted text-sm">${p.property}</div><div class="text-sm mt-1">${fmtDT(apptTime(p))}</div></div><span class="pill" style="background:oklch(0.7 0.19 22 / 20%);color:var(--red)">${apptLabel(p)}</span></button>`).join("")||`<p class="muted text-sm">You're all caught up.</p>`}</div>
  <div class="card p-4 mt-6 text-sm"><span class="muted">Call hours:</span> <b>${o.partner_days.join(", ")}, ${t12(o.partner_start)}–${t12(o.partner_end)}</b> · <a href="#/dashboard/settings" class="underline ice">Change</a></div>
  ${DB.partners.some(p=>p.status==="rejected")?`<details class="mt-4"><summary class="muted text-sm cursor-pointer">Rejected requests (${DB.partners.filter(p=>p.status==="rejected").length})</summary><div class="grid gap-2 mt-2">${DB.partners.filter(p=>p.status==="rejected").map(p=>`<button class="card p-3 text-left text-sm" onclick="openPartner(${p.id})">${p.company} · ${p.property}</button>`).join("")}</div></details>`:""}`;
}
function t12(hm){const[h,m]=hm.split(":").map(Number);return `${(h%12)||12}${m?":"+String(m).padStart(2,"0"):""}${h<12?"am":"pm"}`}
function slotOptions(len){const o=DB.operator,out=[];len=len||o.partner_slot;const[sh,sm]=o.partner_start.split(":").map(Number),[eh,em]=o.partner_end.split(":").map(Number);for(let t=sh*60+sm;t+len<=eh*60+em;t+=len)out.push(String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"));return out}
function rescheduleMsg(p,newIso){const first=p.contact.replace(/^(Rev\.|Dr\.|Mr\.|Ms\.|Mrs\.)\s*/,"").split(" ")[0];
  return `Hi ${first}, thank you so much for requesting to talk with ${DB.operator.business_name} about ${p.kind==="customer"?p.property+" at "+p.location:"snow removal for "+p.property+" in "+p.location} on ${fmtDT(p.requested)}. We're unable to meet at that time, but we would love to talk with you on ${fmtDT(newIso)}. Are you available then?`}
function partnerDlg(html){const d=$("#jobdlg");d.innerHTML=`<div class="p-6 max-h-[85vh] overflow-auto">${html}</div>`;if(!d.open)d.showModal()}
function openPartner(id){

function confirmPartner(id,iso){const p=DB.partners.find(x=>x.id===id);p.status="confirmed";p.final=iso;p.log.push([new Date().toISOString(),`Operator locked in the call for ${fmtDT(iso)}.`]);save();jobdlg.close();tabPartners();toast("Confirmed. It's green on your calendar.")}
function rejectOrReschedule(id){const p=DB.partners.find(x=>x.id===id);

function rsIso(){const[h,m]=$("#rsT").value.split(":");const d=new Date($("#rsD").value+"T00:00");d.setHours(+h,+m);return d.toISOString()}
function rsPreview(id){const p=DB.partners.find(x=>x.id===id);$("#rsMsg").textContent=rescheduleMsg(p,rsIso())}
function sendReschedule(id,how){const p=DB.partners.find(x=>x.id===id),iso=rsIso(),now=new Date().toISOString();p.proposed=iso;p.status="reschedule_sent";
  if(how==="text"){p.log.push([now,p.can_text?`Reschedule text sent to ${p.phone} offering ${fmtDT(iso)}.`:`${p.phone} can't get texts, so the text was skipped.`]);p.log.push([now,`Same message emailed to ${p.email}.`])}

      Q.lines=lines;DB.jobs.unshift(Q.job);save();Q.step=4;qStep();};}
  else if(Q.step===4){const j=Q.job,p=DB.pricing;el.innerHTML=`${steps(4)}<h1 class="display text-3xl">Your price</h1>
    <div class="card p-6 mt-6">${Q.lines.map(l=>`<div class="flex justify-between py-2"><span>${l[0]}</span><span>${money(l[1])}</span></div>`).join("")}
    <div class="flex justify-between pt-4 mt-2 border-t text-xl font-bold" style="border-color:var(--border)"><span>Total</span><span>${money(j.total)}</span></div>
    <p class="muted text-xs mt-1">This price is held for you for 24 hours.</p>
    <div class="flex justify-between mt-4 p-4 rounded-xl" style="background:color-mix(in oklab,var(--orange) 15%,var(--card))"><span class="font-bold">Deposit due now</span><span class="display text-2xl orange">${money(j.deposit)}</span></div>
    <p class="muted text-sm mt-3">${j.type==="Scheduled"?"Scheduled for "+j.date:"Plow Now: you're added to today's route"}. Balance due after service.</p>
    <p class="muted text-xs mt-2">${BR.key!=="mow"?`We plow at ${p.trigger_in||2}+ inches. Cancel free until we're on the way`:`Cancel free with ${p.mow_notice_hrs||24} hours' notice`}; after that a ${money(p.trip_fee)} trip fee comes out of your deposit. If we can't make it, you choose a rollover or a full refund.</p></div>
    ${j.outside?`<div class="card p-4 mt-4" style="border-color:var(--yellow)"><b class="text-[var(--yellow)]">Heads up:</b> ZIP ${j.zip} is outside ${o.business_name}'s usual area. Your request is saved, and they'll confirm if they can serve you.</div>`:""}
    <div class="card p-5 mt-6"><div class="font-bold">Do you need to talk to someone first?</div>
      <p class="muted text-sm mt-1">Our crew is out working with their hands full. You don't need a call. Once you book, we'll be there and get it done.</p>
      <div class="grid gap-2 mt-4">
        <label class="choice flex gap-3 items-start ${Q.talk?"":"on"}"><input type="radio" name="talk" ${Q.talk?"":"checked"} onchange="Q.talk=null;qStep()" class="mt-1"><span><b>No call needed, just get it done</b><br><span class="muted text-sm">Fastest. Add notes for the driver anytime by text.</span></span></label>
        <label class="choice flex gap-3 items-start ${Q.talk?"on":""}"><input type="radio" name="talk" ${Q.talk?"checked":""} onchange="Q.talk={hold:false};qStep()" class="mt-1"><span><b>I'd like a quick call too (up to 15 min)</b><br><span class="muted text-sm">Booked during the owner's call hours.</span></span></label>
      </div>
      ${Q.talk?`<div class="mt-4 p-4 rounded-xl text-sm" style="background:color-mix(in oklab,var(--yellow) 14%,var(--card));border:1px solid var(--yellow)"><b>Heads up:</b> calls happen during set hours, which may be after your job time. Pick what you want us to do:</div>
      <div class="grid gap-2 mt-3">
        <label class="choice flex gap-3 items-start ${Q.talk.hold?"":"on"}"><input type="radio" name="hold" ${Q.talk.hold?"":"checked"} onchange="Q.talk.hold=false;qStep()" class="mt-1"><span><b>Do my job on time, and call me when you can</b></span></label>
        <label class="choice flex gap-3 items-start ${Q.talk.hold?"on":""}"><input type="radio" name="hold" ${Q.talk.hold?"checked":""} onchange="Q.talk.hold=true;qStep()" class="mt-1"><span><b>Hold my job until we talk</b><br><span class="muted text-sm">Your service could miss today's route. No deposit until after the call.</span></span></label>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-3"><select id="tkD" class="input">${callDays().map(d=>`<option value="${d.toISOString().slice(0,10)}">${d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}</option>`).join("")}</select>
      <select id="tkT" class="input">${slotOptions(15).map(t=>`<option value="${t}">${t12(t)}</option>`).join("")}</select></div>`:""}
    </div>
    <button class="btn btn-orange w-full mt-6 text-lg" onclick="acceptQuote()">${Q.talk&&Q.talk.hold?"Request my call":"Accept quote and pay deposit"}</button>`;}
  else if(Q.step===5){const j=Q.job;const held=j.call&&j.call.hold;el.innerHTML=`${steps(5)}<div class="card p-8 text-center"><div class="display text-3xl">${held?"Call requested!":"You're on the list!"}</div>
    <p class="muted mt-3">${held?`We'll talk on ${fmtDT(j.call.when)}. Your job is on hold until then.`:o.deposit_payment_link?"Your deposit page opened in a new tab. Once it's paid, you're locked in.":"We'll text you a deposit link."}${j.call&&!held?` Your quick call is set for ${fmtDT(j.call.when)}.`:""}</p></div>
    <div class="card p-6 mt-4"><div class="font-bold">A quick note from ${o.business_name}</div><p class="text-sm mt-2 leading-relaxed">${aiNotice(o,j.name)}</p></div>
    ${savedNumber(o)}
    <div class="card p-6 mt-4 text-sm flex gap-4 items-center"><div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0" style="background:var(--orange)">📲</div><div class="flex-1"><div class="font-bold">Get the ${o.business_name} app</div><div class="muted">Book again in two taps, track your job and get storm alerts. Free.</div></div><button class="btn btn-ghost !min-h-[40px] text-sm" onclick="toast('Tap Share, then Add to Home Screen')">Install</button></div>
    <div class="card p-6 mt-4 text-sm"><div class="font-bold mb-2">What happens next</div>
      <ol class="grid gap-2 list-decimal pl-5"><li>You'll get a text and email confirming your request, with this same note.</li><li>${held?"We call you at your booked time, then lock in your service.":"We show up and take care of it."}</li><li>We'll send a reminder before your service and let you know when we're on the way.</li><li>When the job is done, you'll get a text and a thank-you email so you can check it out and tell us how we did.</li></ol></div>
    <div class="card p-6 mt-4 text-sm"><div class="font-bold">Need to cancel or change plans?</div><p class="muted mt-1">${BR.key!=="mow"?"Free until we're on the way.":`Free with ${DB.pricing.mow_notice_hrs||24} hours' notice.`} Manage it anytime from the link in your confirmation.</p><button class="btn btn-ghost w-full mt-3" onclick="Q.step=6;qStep()">Manage my booking</button></div>
    <div class="todo mt-4 text-left">IN THE REAL APP: the job saves to the operator's dashboard and goes to his Boss Growth Machine inbox, where the AI sends the confirmation text + email above.${j.call?" The call shows up red on his call calendar until he confirms it.":""} Opening the payment page never marks a deposit paid. The operator confirms that.</div>
    <div class="text-center">
    <a href="#/dashboard" class="btn btn-ghost mt-6">See this job in the operator dashboard →</a></div>`;}
  else if(Q.step===6){const j=Q.job,late=!!j.otw,fee=late?Math.min(DB.pricing.trip_fee,j.deposit):0;el.innerHTML=`<h1 class="display text-3xl">Your deposit</h1>
    <div class="card p-6 mt-6"><div class="flex justify-between"><span>Deposit paid</span><b>${money(j.deposit)}</b></div>${fee?`<div class="flex justify-between mt-2 muted"><span>Trip fee (driver was on the way)</span><span>−${money(fee)}</span></div>`:""}</div>
    <p class="muted text-sm mt-4">Choose what happens to your deposit:</p>
    <div class="grid gap-3 mt-3"><button class="choice" onclick="depositChoice('roll')"><div class="font-bold text-lg">Roll it to my next service</div><div class="muted text-sm">${money(j.deposit-fee)} is held for your next visit. Once rolled over, it's non-refundable.</div></button>
    <button class="choice" onclick="depositChoice('refund')"><div class="font-bold text-lg">Refund my deposit</div><div class="muted text-sm">${money(j.deposit-fee)} goes back to your card automatically. Most banks show it in 5 to 10 business days.</div></button></div>
    <button class="btn btn-ghost w-full mt-4" onclick="Q.step=5;qStep()">Keep my booking</button>`;}
}
function depositChoice(k){const j=Q.job;j.status="Cancelled";j.deposit_choice=k;save();$("#qs").innerHTML=`<div class="card p-8 text-center"><div class="display text-3xl">${k==="roll"?"Rolled over!":"Refund on its way"}</div><p class="muted mt-3">${k==="roll"?`Your deposit is saved for your next service with ${DB.operator.business_name}.`:"Your refund was sent automatically. No call needed."}</p></div><div class="todo mt-4">IN THE REAL APP: the refund runs automatically through the operator's deposit account, and the operator's dashboard shows the job as cancelled with the customer's choice.</div>`}
function consentBoxes(o){return `<div class="grid gap-3 text-sm">
  <label class="flex gap-3 items-start"><input type="checkbox" name="sms" class="mt-1 w-5 h-5"><span><b>Service updates.</b> I agree that ${o.business_name} may send automated text messages and make calls using an AI-generated or prerecorded voice to the phone number I entered, for confirmations, appointment reminders and on-the-way notices about my service.</span></label>
  <label class="flex gap-3 items-start"><input type="checkbox" name="aicalls" class="mt-1 w-5 h-5"><span><b>Offers and storm alerts.</b> I agree that ${o.business_name} may send automated marketing text messages and make marketing calls using an AI-generated or prerecorded voice to the phone number I entered, including storm alerts and offers for future service.</span></label>
  <p class="muted text-xs leading-relaxed">Checking either box is optional and is not a condition of buying anything. Message frequency varies. Message and data rates may apply. Reply STOP to any text to opt out, or HELP for help. On a call, say "stop calling." You can also opt out by calling ${o.phone}. We never sell or share your mobile number or opt-in information with third parties for their marketing. See our <a class="underline" href="#/privacy">Privacy Policy</a> and <a class="underline" href="#/terms">Terms</a>.</p></div>`}
function waiverText(o){const snow=BR.key!=="mow",p=DB.pricing;return snow?[
 `${o.business_name} clears snow from the areas you selected when snowfall reaches ${p.trigger_in||2} inches or more, as conditions and safety allow.`,
 "Please mark the edges of your driveway, curbs, landscaping, sprinkler heads and anything buried under snow. We are not responsible for damage to unmarked or hidden items.",
 "Snow and ice can return after we leave. Refreezing, drifting and city plows pushing snow back are outside our control, so use care and salt as needed.",
 "Plowing can scuff grass edges and loosen gravel. We fix our own damage, but not normal wear like this or cracks that were already there.",
 "If something is damaged, send photos within 24 hours of service so we can make it right.",
 `Cancel free until we're on the way. After that, a $${p.trip_fee} trip fee comes out of your deposit. If we can't make it, you choose a rollover or a full refund.`
]:[
 `${o.business_name} mows and services the areas you selected, weather and ground conditions allowing.`,
 "Please pick up toys, hoses, pet waste and anything in the yard before we arrive. We are not responsible for items left in the lawn.",
 "Mark sprinkler heads, invisible dog fences and anything buried. We are not responsible for damage to unmarked or hidden items.",
 "Rain and wet ground can move your service a day or two for safety and lawn health.",
 "If something is damaged, send photos within 24 hours of service so we can make it right.",
 `Cancel free with ${p.mow_notice_hrs||24} hours' notice. After that, a $${p.trip_fee} trip fee comes out of your deposit. If we can't make it, you choose a rollover or a full refund.`]}
function waiverBox(o){return `<details class="card p-4 text-sm"><summary class="cursor-pointer font-bold">${o.business_name} service terms and liability waiver</summary><ol class="list-decimal pl-5 grid gap-2 mt-3 muted">${waiverText(o).map(t=>`<li>${t}</li>`).join("")}</ol></details>
  <label class="flex gap-3 text-sm items-start"><input type="checkbox" name="waiver" required class="mt-1 w-5 h-5"><span>I agree to ${o.business_name}'s service terms and liability waiver.</span></label>`}
function savedNumber(o){return `<div class="card p-6 mt-4 text-sm flex gap-4 items-start"><div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0" style="background:var(--orange)">📇</div><div class="flex-1"><div class="font-bold">Save our number so you never miss us</div><p class="muted mt-1">We call and text from <b>${o.phone}</b> for reminders and "on the way" notices. Save it as <b>${o.business_name}</b> so your phone doesn't block it or send it to spam.</p><button class="btn btn-ghost w-full mt-3" onclick="dlVcard()">Save ${o.business_name} to my contacts</button><p class="muted text-xs mt-2">iPhone: tap the button, then Create New Contact. Android: tap it, then Save. Also check that unknown-caller silencing isn't on for this number.</p></div></div>`}
function dlVcard(){const o=DB.operator;const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${o.business_name}\nORG:${o.business_name}\nTEL;TYPE=WORK,VOICE:${o.phone}\nEMAIL:${o.email||""}\nNOTE:Snow and lawn service. Reminders and on-the-way calls come from this number.\nEND:VCARD`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download=o.business_name.replace(/[^a-z0-9]+/gi,"-")+".vcf";a.click();toast("Contact card downloaded")}
function aiNotice(o,name){const first=(name||"").split(" ")[0]||"there";return `Hi ${first}, thank you so much for reaching out! We're out here working hard and our hands are full, so we use an AI assistant to get back to you as fast as possible. A real person on our team monitors and approves every conversation, and we follow our process on every job. If you ever have a question, call us at ${o.phone} and leave a message, and we'll get back to you as soon as we can. If you need to talk to a person, just let us know.`}
function callDays(){const o=DB.operator,out=[];for(let i=0;out.length<7&&i<21;i++){const d=new Date();d.setDate(d.getDate()+i);if(o.partner_days.includes(d.toLocaleDateString("en-US",{weekday:"short"})))out.push(d)}return out}
function acceptQuote(){const j=Q.job,o=DB.operator;
  if(Q.talk){const[h,m]=$("#tkT").value.split(":");const when=new Date($("#tkD").value+"T00:00");when.setHours(+h,+m);j.call={when:when.toISOString(),hold:!!Q.talk.hold};
    DB.partners.unshift({id:Date.now()+1,kind:"customer",job_id:j.id,company:"Customer call: "+j.name,contact:j.name,phone:j.phone,can_text:true,email:j.email||"",property:"your "+(j.type==="Plow Now"?"Plow Now":"scheduled")+" job",location:j.address,notes:(j.call.hold?"HOLD the job until this call. ":"Job goes ahead as booked. ")+(j.notes||""),created:new Date().toISOString(),requested:j.call.when,status:"requested",log:[[new Date().toISOString(),"Customer asked for a 15-minute call from the quote page"+(j.call.hold?" and asked to hold the job until then.":". Job stays on schedule.")]]})}
  j.status=j.call&&j.call.hold?"New":"Quoted";j.accepted=!(j.call&&j.call.hold);save();
  if(!(j.call&&j.call.hold)&&o.deposit_payment_link)window.open(o.deposit_payment_link,"_blank");Q.step=5;qStep()}

route();
</script>
</body>
</html>
