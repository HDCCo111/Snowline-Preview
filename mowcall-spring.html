<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>try{var t=localStorage.getItem("snowline_theme")||"dark";if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.classList.add("light")}catch(e){}</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0}
  button{background:transparent;color:inherit;font:inherit;border:0;cursor:pointer}
  a{color:inherit}
  :root{
    --bg:oklch(0.18 0.04 255); --fg:oklch(0.97 0.01 230); --card:oklch(0.23 0.045 255);
    --muted:oklch(0.27 0.05 255); --mfg:oklch(0.78 0.03 235);
    --orange:oklch(0.74 0.17 140); --ice:oklch(0.86 0.09 155);
    --border:oklch(0.85 0.08 225 / 18%); --input:oklch(0.85 0.08 225 / 25%);
    --red:oklch(0.7 0.19 22); --green:oklch(0.75 0.15 150); --yellow:oklch(0.85 0.15 90);
  }
  html.light{
    --bg:oklch(0.98 0.006 240); --fg:oklch(0.22 0.04 255); --card:oklch(1 0 0);
    --muted:oklch(0.94 0.012 240); --mfg:oklch(0.46 0.03 250);
    --orange:oklch(0.6 0.16 145); --ice:oklch(0.48 0.12 155);
    --border:oklch(0.3 0.05 255 / 13%); --input:oklch(0.3 0.05 255 / 28%);
    --red:oklch(0.58 0.2 25); --green:oklch(0.55 0.15 150); --yellow:oklch(0.62 0.14 75);
  }
  html,body{background:var(--bg);color:var(--fg);font-family:Archivo,system-ui,sans-serif}
  .display{font-family:"Archivo Black",Archivo,sans-serif;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--border);border-radius:1rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:.75rem;font-weight:700;padding:0 1.1rem;transition:filter .15s}
  .btn-sm{min-height:40px;padding:0 .8rem;font-size:.9rem}
  .btn-orange{background:var(--orange);color:oklch(0.15 0.03 255)}
  .btn-orange:hover{filter:brightness(1.08)}
  .btn-ghost{border:1px solid var(--input);color:var(--fg)}
  .btn-ghost:hover{background:var(--muted)}
  .btn-red{border:1px solid var(--red);color:var(--red)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .input{width:100%;min-height:48px;border-radius:.75rem;background:var(--bg);color:var(--fg);border:1px solid var(--input);padding:.75rem 1rem;font-size:1rem}
  .input:focus{outline:2px solid var(--orange);outline-offset:1px}
  .muted{color:var(--mfg)} .ice{color:var(--ice)} .orange{color:var(--orange)}
  .tab{padding:.7rem 1rem;border-radius:.75rem;font-weight:600;white-space:nowrap;color:var(--mfg)}
  .tab.on{background:var(--muted);color:var(--fg)}
  .chip{border:1px solid var(--input);border-radius:999px;padding:.45rem .95rem;font-size:.9rem;white-space:nowrap}
  .chip.on{background:var(--orange);color:oklch(0.15 0.03 255);border-color:var(--orange);font-weight:700}
  .choice{border:2px solid var(--input);border-radius:1rem;padding:1rem;text-align:left;width:100%}
  .choice.on{border-color:var(--orange);background:color-mix(in oklab,var(--orange) 10%,var(--card))}
  .pill{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
  .p-green{background:oklch(0.75 0.15 150 / 20%);color:var(--green)}
  .p-yellow{background:oklch(0.85 0.15 90 / 20%);color:var(--yellow)}
  .p-red{background:oklch(0.7 0.19 22 / 20%);color:var(--red)}
  .p-ice{background:oklch(0.86 0.09 155 / 18%);color:var(--ice)}
  .p-muted{background:var(--muted);color:var(--mfg)}
  .todo{border:1px dashed var(--yellow);color:var(--yellow);border-radius:.75rem;padding:.6rem .8rem;font-size:.8rem}
  .scroll-x{overflow-x:auto;scrollbar-width:none} .scroll-x::-webkit-scrollbar{display:none}
  .bubble{max-width:85%;padding:.55rem .8rem;border-radius:1rem;font-size:.9rem;line-height:1.35}
  .bubble.in{background:#e5e5ea;color:#111;border-bottom-left-radius:.3rem}
  .meter{height:10px;border-radius:999px;background:var(--muted);overflow:hidden}
  .meter>div{height:100%;background:var(--orange)}
  .badge{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--green);color:var(--green);border-radius:999px;padding:.3rem .7rem;font-size:.8rem;font-weight:700}
  #qmap{height:340px;border-radius:1rem;overflow:hidden;border:1px solid var(--border)}
  #qmap.drawing{cursor:crosshair}
  .leaflet-container{font-family:Archivo,sans-serif}
  dialog::backdrop{background:rgb(0 0 0 / .6)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000}
</style>
</head>
<body class="min-h-screen">

<div class="sticky top-0 z-[1500] text-xs" style="background:oklch(0.85 0.15 90);color:oklch(0.15 0.03 255)">
  <div class="max-w-5xl mx-auto px-4 py-2 flex flex-wrap gap-x-4 gap-y-1 items-center">
    <strong>MOWCALL PREVIEW · sample data, nothing is sent</strong>
    <a href="#/route" class="underline">1. Today's route</a>
    <a href="#/customers" class="underline">2. Customers</a>
    <a href="#/settings" class="underline">3. Settings</a>

    <a href="#/quote" class="underline">5. Homeowner quote</a>
    <a href="#/texts" class="underline">6. Customer texts</a>
    <a href="#/sign?c=4" class="underline">7. Agreement renewal (customer)</a>
    <a href="index.html#/mow" class="underline">MowCall landing page</a>
    <button onclick="resetDemo()" class="underline">Reset sample data</button>
  </div>
</div>

<div id="app" class="max-w-5xl mx-auto px-4 py-6"></div>

<dialog id="dlg" class="card p-0 w-[min(560px,94vw)]" style="background:var(--card);color:var(--fg)"><div id="dlgBody" class="p-6"></div></dialog>
<div id="toast"></div>

<script>
/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const money=n=>"$"+Math.round(Number(n)).toLocaleString();
const fmt=n=>Math.round(n).toLocaleString();
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_ES={Mon:"lunes",Tue:"martes",Wed:"miércoles",Thu:"jueves",Fri:"viernes",Sat:"sábado"};
const DAY_EN={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday"};
const DAYMS=864e5,ago=d=>new Date(Date.now()-d*DAYMS).toISOString();
const WAIVER_VER="mow-terms-2026-1";
function toast(m){const t=$("#toast");t.innerHTML=`<div class="card px-4 py-3 text-sm font-semibold shadow-xl">${m}</div>`;clearTimeout(t._h);t._h=setTimeout(()=>t.innerHTML="",3500)}
function openDlg(html){$("#dlgBody").innerHTML=html;$("#dlg").showModal()}
function closeDlg(){$("#dlg").close()}

/* ===================== SAMPLE DATA ===================== */
const MOWERS={push:{label:"21-inch push mower",min:7},walk:{label:"36–48-inch walk-behind",min:4.5},zero:{label:"52–60-inch zero-turn",min:3}};
const SEED={
 op:{business:"Sean's Lawn & Snow",plan:"starter",payMode:"choose",
     rate:6.8,minimum:48,firstCut:28,tallFee:28,tallInches:6,mower:"zero",setupMin:10,floorOn:false,floorRate:68,
     spanish:true,notice:24,home:[40.0996,-83.1141],qbo:false,team:[{name:"Mike Torres",phone:"(614) 555-0142"}],
     creds:{
      insured:{on:true,detail:"$1,000,000 general liability",exp:"2027-04-30",proof:true},
      licensed:{on:true,detail:"Ohio business license",exp:"2027-12-31",proof:true},
      bonded:{on:false,detail:"",exp:"",proof:false}}},
 customers:[
  {id:1,name:"Dana Price",addr:"412 Oak Ridge Dr",zones:{front:2400,back:4100},freq:"weekly",day:"Tue",pay:"per_visit",lang:"en",notes:"Gate code 4417. Friendly dog (Bo), keep gate shut.",status:"active",lat:40.1052,lng:-83.1010,waiver:{signed:"Dana Price",at:ago(351),version:WAIVER_VER}},
  {id:2,name:"Luis Ramírez",addr:"88 Willow Ct",zones:{front:3800,back:7900,side:900},freq:"weekly",day:"Tue",pay:"monthly",lang:"es",notes:"Perro en el patio de atrás. Bolsas de basura en la acera los martes.",status:"active",lat:40.0921,lng:-83.1265,waiver:{signed:"Luis Ramírez",at:ago(372),version:WAIVER_VER},renew:{sent:ago(7),reminders:0}},
  {id:3,name:"Marcy Hill",addr:"1503 Birch Ln",zones:{front:1900},freq:"biweekly",day:"Tue",pay:"per_visit",lang:"en",notes:"Front yard only. Side gate sticks.",status:"active",lat:40.1110,lng:-83.1190,waiver:{signed:"Marcy Hill",at:ago(120),version:WAIVER_VER}},
  {id:4,name:"Greg & Tasha Moore",addr:"27 Cedar Pt",zones:{front:3100,back:5200},freq:"weekly",day:"Tue",pay:"per_visit",lang:"en",notes:"",status:"active",lat:40.0958,lng:-83.1032,waiver:{signed:"Tasha Moore",at:ago(200),version:"mow-terms-2025-1"}},
  {id:5,name:"Rosa Delgado",addr:"640 Maple Ave",zones:{back:4600},freq:"biweekly",day:"Tue",pay:"monthly",lang:"es",notes:"Solo el patio de atrás. Mover la manguera antes de cortar.",status:"active",lat:40.1031,lng:-83.1302,waiver:{signed:"Rosa Delgado",at:ago(380),version:WAIVER_VER},renew:{sent:ago(22),reminders:1}},
  {id:6,name:"Ken Whitfield",addr:"9 Pine Hollow",zones:{front:5200,back:8800},freq:"weekly",day:"Wed",pay:"per_visit",lang:"en",notes:"Paused for vacation until the 20th.",status:"paused",lat:40.0880,lng:-83.1120,waiver:{signed:"Ken Whitfield",at:ago(60),version:WAIVER_VER}}
 ],
 extraActive:25,
 route:{day:"Tue",stops:[1,2,3,4,5],state:{}},
 texts:[],viewAs:"owner",crewIdx:0
};
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem("mowcall_demo_v3"))}catch(e){}if(!DB)DB=JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem("mowcall_demo_v3",JSON.stringify(DB))}catch(e){}}
function resetDemo(){try{localStorage.removeItem("mowcall_demo_v3")}catch(e){}load();waiverSweep();resetQuote();toast("Sample data reset");route(true)}

const PLANS={starter:{name:"Junior Boss",price:48,year:528,cap:25},starterplus:{name:"Junior Boss Plus",price:118,year:1298,cap:60},solo:{name:"Monthly Solo",price:148,year:1628,cap:null},crew:{name:"Monthly Crew",price:398,year:4378,cap:null}};const BRAND_LAUNCH=148;
const activeCount=()=>DB.customers.filter(c=>c.status==="active").length+DB.extraActive;
const cust=id=>DB.customers.find(c=>c.id===id);
const FREQ={weekly:"Weekly",biweekly:"Every other week",once:"One time"};
const PAY={per_visit:"Autopay after each visit",monthly:"Flat monthly"};
const ZN={front:"Front yard",back:"Backyard",side:"Side yards"};
const ZN_ES={front:"Jardín delantero",back:"Patio trasero",side:"Jardines laterales"};
const ZCOLOR={front:"#4ade80",back:"#38bdf8",side:"#facc15"};

/* ===================== PRICING ENGINE ===================== */
// Price per visit = lawn sq ft x operator's rate per 1,000 sq ft, never below the per-visit minimum.
// Optional: an hourly floor makes sure the price covers the operator's target hourly rate.
function sqftOf(z){return Object.values(z||{}).reduce((a,b)=>a+(Number(b)||0),0)}
function minutesFor(sq){const o=DB.op;return o.setupMin+sq/1000*MOWERS[o.mower].min}
function priceFor(z){
 const o=DB.op,sq=sqftOf(z),lines=Object.entries(z||{}).filter(([k,v])=>v>0).map(([k,v])=>({zone:k,sqft:v,price:v/1000*o.rate}));
 let base=lines.reduce((a,l)=>a+l.price,0),total=Math.max(o.minimum,base),why="";
 if(total>base)why="minimum";
 const mins=minutesFor(sq);
 if(o.floorOn){const floor=mins/60*o.floorRate;if(floor>total){total=floor;why="hourly"}}
 total=Math.round(total);
 return {sqft:sq,lines,base,total,why,mins,hourly:total/(mins/60)};
}
const visitPrice=c=>priceFor(c.zones).total;
const monthlyFor=c=>Math.round(visitPrice(c)*(c.freq==="weekly"?52:26)/12);

/* ===================== CREDENTIALS ===================== */
// Shown to customers ONLY when the operator turned it on, uploaded proof and it hasn't expired. Otherwise nothing is said.
function liveCreds(){const c=DB.op.creds,today=new Date().toISOString().slice(0,10);
 return Object.entries(c).filter(([k,v])=>v.on&&v.proof&&(!v.exp||v.exp>=today)).map(([k,v])=>({k,...v}))}
function trustBar(lang){const L=lang==="es",cs=liveCreds();if(!cs.length)return "";
 const name={insured:L?"Asegurado":"Insured",licensed:L?"Con licencia":"Licensed",bonded:L?"Afianzado":"Bonded"};
 return `<div class="card p-4 mb-4" style="background:var(--bg)"><div class="flex flex-wrap gap-2">${cs.map(c=>`<span class="badge">✓ ${name[c.k]}</span>`).join("")}</div>
 <div class="muted text-xs mt-2">${cs.map(c=>`${name[c.k]}: ${esc(c.detail)}${c.exp?` (${L?"vigente hasta":"valid through"} ${c.exp})`:""}`).join(" · ")}. ${L?"Comprobante en archivo.":"Proof on file."}</div></div>`}

/* ===================== CUSTOMER TEXT TEMPLATES ===================== */
const T={
 en:{
  aiNote:b=>`${b} uses an AI assistant to text and answer calls so the crew can stay on the job. A person on our team checks every conversation.`,
  rain:(n,b,d)=>`Hi ${n}, it's ${b}. Rain today, so your mow moves to ${d}. Nothing for you to do. Reply CHANGE if that day doesn't work.`,
  omw:(n,b)=>`Hi ${n}, ${b} is on the way. About 15 minutes out. Please make sure the gate is unlocked and pets are inside.`,
  done:(n,b,a,l)=>`Done! Your lawn at ${a} is mowed and edged. See the photo: ${l} . ${b}`,
  skip:(n,b)=>`Hi ${n}, we skipped your mow today because the ground was too wet. You won't be charged for today. See you next visit. ${b}`,
  paid:(a)=>`Payment received: ${a} by bank (ACH). Thank you!`,
  renew:(n,b,l,t)=>`Hi ${n}, it's ${b}. ${t?"We updated our service agreement.":"It's been a year since you signed our service agreement."} Please review and sign when you have a minute: ${l} . Your mowing and payments keep going as usual.`,
  remind:(n,b,l)=>`Hi ${n}, quick reminder from ${b}: please sign this year's service agreement when you can: ${l} . Nothing changes with your service.`
 },
 es:{
  aiNote:b=>`${b} usa un asistente de IA para enviar mensajes y contestar llamadas, así el equipo puede seguir trabajando. Una persona de nuestro equipo revisa cada conversación.`,
  rain:(n,b,d)=>`Hola ${n}, le escribe ${b}. Hoy llueve, así que su corte de césped pasa al ${d}. No tiene que hacer nada. Responda CAMBIAR si ese día no le funciona.`,
  omw:(n,b)=>`Hola ${n}, ${b} va en camino. Llegamos en unos 15 minutos. Por favor deje la reja abierta y las mascotas adentro.`,
  done:(n,b,a,l)=>`¡Listo! Su césped en ${a} ya está cortado y bordeado. Vea la foto: ${l} . ${b}`,
  skip:(n,b)=>`Hola ${n}, hoy no cortamos su césped porque el suelo estaba muy mojado. No se le cobrará por hoy. Nos vemos en la próxima visita. ${b}`,
  paid:(a)=>`Pago recibido: ${a} por banco (ACH). ¡Gracias!`,
  renew:(n,b,l,t)=>`Hola ${n}, le escribe ${b}. ${t?"Actualizamos nuestro acuerdo de servicio.":"Ya pasó un año desde que firmó nuestro acuerdo de servicio."} Por favor revíselo y fírmelo cuando tenga un minuto: ${l} . Su servicio y sus pagos siguen igual.`,
  remind:(n,b,l)=>`Hola ${n}, un recordatorio de ${b}: por favor firme el acuerdo de servicio de este año cuando pueda: ${l} . Su servicio no cambia.`
 }
};
function logText(c,kind,body){DB.texts.unshift({to:c.name,lang:c.lang,kind,body,at:new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})});DB.texts=DB.texts.slice(0,30);save()}
const photoLink=id=>`mowcall.com/p/${(id*7919).toString(36)}`;
const first=n=>String(n).split(" ")[0];

/* ===================== OPERATOR SHELL ===================== */
const TABS=[["route","Today's route"],["customers","Customers"],["settings","Settings"],["plan","Plan & add-ons"],["quote","Homeowner quote"],["texts","Customer texts"]];
function shell(tab,inner){
 if(DB.viewAs==="crew"){const m=DB.op.team[DB.crewIdx]||{name:"Crew member"};
  return `<div class="card p-3 mb-4 text-sm flex flex-wrap justify-between items-center gap-2" style="border-color:var(--yellow)"><span><b>Crew view:</b> what ${esc(m.name)} sees on their own login. No prices, payments, customer list, exports or settings.</span><button class="btn btn-sm btn-ghost" onclick="DB.viewAs='owner';save();location.hash='#/plan'">Back to owner view</button></div>
  <div class="mb-4"><div class="text-xs muted">MowCall · ${esc(m.name)}</div><div class="display text-2xl">${esc(DB.op.business)}</div></div>${inner}`}
 return `<div class="flex items-center justify-between gap-3 mb-4">
  <div><div class="text-xs muted">MowCall · operator view</div><div class="display text-2xl">${esc(DB.op.business)}</div></div>
  <a href="#/plan" class="btn btn-sm btn-orange">Upgrade</a></div>
  <nav class="scroll-x flex gap-2 pb-3">${TABS.map(t=>`<a href="#/${t[0]}" class="tab ${t[0]===tab?"on":""}">${t[1]}</a>`).join("")}</nav>
  ${inner}`;
}
function capLine(){const p=PLANS[DB.op.plan],n=activeCount();
 return p.cap?`<div class="text-sm muted mb-4">${p.name}: <b style="color:var(--fg)">${n} of ${p.cap}</b> active customers${n>=p.cap?" · new recurring requests wait in your Inbox":""}</div>`:`<div class="text-sm muted mb-4">${p.name}: <b style="color:var(--fg)">${n}</b> active customers, no limit</div>`}

/* ===================== 1. TODAY'S ROUTE ===================== */
function viewRoute(){
 const r=DB.route,crew=DB.viewAs==="crew",stops=r.stops.map(cust).filter(c=>c&&c.status==="active"),st=id=>r.state[id]||"scheduled";
 const badge={scheduled:["Scheduled","p-muted"],omw:["On the way","p-yellow"],done:[crew?"Done":"Done · billed","p-green"],skipped:[crew?"Skipped":"Skipped · not billed","p-ice"],missed:["Missed · reschedule","p-red"],moved:["Moved (rain)","p-ice"]};
 const doneCount=stops.filter(c=>st(c.id)==="done").length;
 const earned=stops.filter(c=>st(c.id)==="done"&&c.pay==="per_visit").reduce((s,c)=>s+visitPrice(c),0);
 const totalMin=stops.reduce((s,c)=>s+priceFor(c.zones).mins,0);
 return shell("route",`${crew?"":capLine()}
 <div class="card p-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
   <div><div class="display text-xl">${DAY_EN[r.day]}'s route</div><div class="muted text-sm">${stops.length} stops · about ${Math.round(totalMin/60*10)/10} hours on site · about ${routeMiles(stops).toFixed(1)} miles of driving · ${doneCount} done${crew?"":` · ${money(earned)} charged by autopay so far`}</div></div>
   ${crew?"":`<button class="btn btn-red" onclick="rainDlg()">🌧 Rain delay: move today</button>`}
  </div>
  <div class="flex flex-wrap gap-2 mt-3">${crew?"":`<button class="btn btn-sm btn-ghost" onclick="bestOrder()">↕ Best order</button>`}${mapsLinks(stops)}</div>
  <div class="grid gap-3 mt-4">
  ${stops.map((c,i)=>{const s=st(c.id),[bt,bc]=badge[s],pr=priceFor(c.zones);return `<div class="card p-4" style="background:var(--bg)">
   <div class="flex flex-wrap justify-between gap-2"><div><div class="font-bold">${i+1}. ${esc(c.name)} ${c.lang==="es"?'<span class="pill p-muted">ES</span>':""}</div>
    <div class="muted text-sm">${esc(c.addr)} · ${Object.keys(c.zones).map(z=>ZN[z]).join(" + ")} · ${fmt(pr.sqft)} sq ft${crew?"":` · ${FREQ[c.freq]}`}</div>
    ${crew?`<div class="text-sm mt-1">About ${Math.round(pr.mins)} min</div>`:`<div class="text-sm mt-1">${c.pay==="monthly"?`Flat monthly ${money(monthlyFor(c))}/mo`:`${money(pr.total)}/visit, autopay`} · about ${Math.round(pr.mins)} min (${money(pr.hourly)}/hr)</div>`}
    ${!crew&&needsSign(c)?`<div class="mt-2">${wPill(c)}</div>`:""}</div>
    <span class="pill ${bc} self-start">${bt}</span></div>
   ${c.notes?`<div class="text-sm mt-2"><span class="muted">Property notes:</span> ${esc(c.notes)}</div>`:""}
   <div class="flex flex-wrap gap-2 mt-3">
    <button class="btn btn-sm btn-ghost" ${s!=="scheduled"?"disabled":""} onclick="act(${c.id},'omw')">On the way</button>
    <button class="btn btn-sm btn-orange" ${["done","skipped","moved"].includes(s)?"disabled":""} onclick="doneDlg(${c.id})">Done + photo</button>
    <button class="btn btn-sm btn-ghost" ${["done","skipped","moved"].includes(s)?"disabled":""} onclick="act(${c.id},'skipped')">Skip (too wet, no charge)</button>
    <button class="btn btn-sm btn-ghost" ${["done","skipped","moved","missed"].includes(s)?"disabled":""} onclick="act(${c.id},'missed')">Missed</button>
   </div></div>`}).join("")}
  </div>
  <p class="muted text-xs mt-4"><b>Best order</b> puts stops in the shortest driving order from your shop, using our own math (no map fees). <b>Open in Google Maps</b> gives turn-by-turn directions through every stop in that order, free, in groups of up to 10 stops. ${crew?"":"Only <b>Done</b> triggers autopay for per-visit customers. A yearly agreement renewal never holds up a visit or a payment."}</p>
  ${crew?"":`<div class="todo mt-3">Real build: these buttons send an event to Boss Growth Machine, which sends the text in the customer's language (consent, opt-outs and 9am–8pm quiet hours apply) and runs the ACH charge. Lovable only adds the buttons and the webhook.</div>`}
 </div>`);
}
/* --- route order: nearest-next-stop from the shop; straight-line miles x 1.3 for roads --- */
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const ll=c=>[c.lat||DB.op.home[0],c.lng||DB.op.home[1]];
function routeMiles(list){let p=DB.op.home,m=0;list.forEach(c=>{m+=hav(p,ll(c));p=ll(c)});return m*1.3}
function bestOrder(){const r=DB.route,all=r.stops.map(cust).filter(Boolean),act_=all.filter(c=>c.status==="active"),before=routeMiles(act_);
 let left=[...all],p=DB.op.home,out=[];while(left.length){left.sort((a,b)=>hav(p,ll(a))-hav(p,ll(b)));const n=left.shift();out.push(n);p=ll(n)}
 r.stops=out.map(c=>c.id);const after=routeMiles(out.filter(c=>c.status==="active"));save();
 toast(after<before-0.05?`Reordered. About ${(before-after).toFixed(1)} fewer miles today.`:"Already in the best order.");route()}
function mapsLinks(stops){const pts=stops.filter(c=>!["done","skipped","moved"].includes(DB.route.state[c.id]||"scheduled")).map(ll);if(!pts.length)return "";
 const out=[];let origin=DB.op.home;
 for(let i=0;i<pts.length;i+=9){const chunk=pts.slice(i,i+9),dest=chunk[chunk.length-1],way=chunk.slice(0,-1);
  const u=`https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${origin.join(",")}&destination=${dest.join(",")}${way.length?"&waypoints="+way.map(q=>q.join(",")).join("%7C"):""}`;
  out.push(`<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener" href="${u}">🧭 Open ${pts.length>9?`stops ${i+1}–${i+chunk.length}`:"route"} in Google Maps</a>`);origin=dest}
 return out.join("")}

function wStat(c){const w=c.waiver;if(!w)return{k:"none"};const due=new Date(new Date(w.at).getTime()+365*DAYMS),days=Math.ceil((due-Date.now())/DAYMS);

function wPill(c){const s=wStat(c),r=c.renew;

 if(s.k==="soon")return `<span class="pill p-yellow">Agreement renews in ${s.days} days</span>`;
 const what=s.k==="terms"?"New agreement terms to sign":s.k==="none"?"No agreement on file":`Yearly agreement due ${Math.max(1,-s.days)} days ago`;
 const step=!r?"link not sent yet":r.reminders>=2?"final reminder sent, ask at next visit":r.reminders===1?"link + 1 reminder sent":"link sent";
 return `<span class="pill ${r&&r.reminders>=2?"p-red":"p-yellow"}">${what} · ${step}</span>`}

/* --- geometry: geodesic area of a lat/lng ring, in square feet --- */
function ringSqft(pts){if(pts.length<3)return 0;const R=6378137,rad=d=>d*Math.PI/180;let a=0;
 for(let i=0;i<pts.length;i++){const p1=pts[i],p2=pts[(i+1)%pts.length];a+=(rad(p2[1])-rad(p1[1]))*(2+Math.sin(rad(p1[0]))+Math.sin(rad(p2[0])))}
 return Math.abs(a*R*R/2)*10.7639}

 const prog=Q.step<=4?`<div class="flex gap-1 mt-4">${steps.map((s,i)=>`<div class="flex-1 h-1.5 rounded-full" style="background:${i<Q.step?"var(--orange)":"var(--muted)"}"></div>`).join("")}</div><div class="text-sm font-bold mt-3">${Q.step}. ${steps[Q.step-1]}</div>`:"";
 let body="";
 const pr=priceFor(Q.zones);
 const priceBox=()=>`<div class="card p-4 mt-4" style="background:var(--bg)" id="pbox">${priceBoxInner()}</div>`;
 if(Q.step===1)body=`${trustBar(Q.lang)}
  <div class="flex gap-2">${["home","biz"].map(t=>`<button class="chip ${Q.type===t?"on":""}" onclick="Q.type='${t}';route()">${t==="home"?L.home:L.biz}</button>`).join("")}</div>
  <label class="text-sm font-semibold block mt-4">${L.addr}</label>
  <div class="flex gap-2 mt-1"><div class="relative flex-1"><input id="addr" class="input" autocomplete="off" value="${esc(Q.addr)}" placeholder="123 Main St, Dublin, OH" oninput="suggestAddr(this.value)" onkeydown="if(event.key==='Enter'){$('#addrSug').innerHTML='';findAddr()}"><div id="addrSug" class="absolute left-0 right-0 z-[1000] rounded-xl overflow-hidden" style="background:var(--card)"></div></div><button class="btn btn-orange shrink-0" onclick="findAddr()" id="findBtn">${L.find}</button></div>
  <div id="geoMsg" class="text-sm mt-2"></div>
  <div class="muted text-xs mt-2">${Q.lang==="es"?"O toque su casa en el mapa para elegirla.":"Or tap your house on the map to pick it."}</div>
  <div id="qmap" class="mt-2"></div>
  ${Q.parcel?parcelCard():""}
  <button id="next1" class="btn btn-orange w-full mt-4" ${Q.found?"":"disabled"} onclick="Q.step=2;route()">${L.next}</button>`;
 if(Q.step===2)body=`<div class="text-sm font-semibold">${L.pick}</div>
  <div class="flex flex-wrap gap-2 mt-2">${["front","back","side"].map(z=>`<button class="chip ${Q.zones[z]!==undefined||Q.active===z?"on":""}" onclick="toggleZone('${z}')">${(Q.lang==="es"?ZN_ES:ZN)[z]}</button>`).join("")}</div>
  <div id="drawBar" class="mt-3">${drawBar()}</div>
  <div id="qmap" class="mt-3"></div>
  <button class="btn btn-ghost btn-sm w-full mt-3" onclick="useEstimate()">${L.estimate}</button>
  ${Q.parcel?parcelCard():""}
  ${priceBox()}
  <div class="flex gap-2 mt-4"><button class="btn btn-ghost" onclick="Q.step=1;route()">${L.back}</button><button class="btn btn-orange flex-1" onclick="if(!Object.values(Q.zones).some(v=>v>0)){toast(QT[Q.lang].needZone);return}Q.step=3;route()">${L.next}</button></div>`;
 if(Q.step===3){const payOpts=o.payMode==="choose"?["per_visit","monthly"]:[o.payMode];if(!payOpts.includes(Q.pay))Q.pay=payOpts[0];
  const mo=Math.round(pr.total*(Q.freq==="weekly"?52:26)/12);
  body=`<div class="text-sm font-semibold">${L.freq}</div><div class="flex flex-wrap gap-2 mt-2">${Object.entries(L.freqs).map(([k,v])=>`<button class="chip ${Q.freq===k?"on":""}" onclick="Q.freq='${k}';route()">${v}</button>`).join("")}</div>
  <div class="text-sm font-semibold mt-5">${L.tall(o.tallInches)}</div><div class="flex gap-2 mt-2"><button class="chip ${Q.tall?"on":""}" onclick="Q.tall=true;route()">${L.yes}</button><button class="chip ${!Q.tall?"on":""}" onclick="Q.tall=false;route()">${L.no}</button></div>
  ${Q.freq!=="once"?`<div class="text-sm font-semibold mt-5">${L.pay}</div><div class="grid gap-2 mt-2">${payOpts.map(k=>`<button class="choice ${Q.pay===k?"on":""}" onclick="Q.pay='${k}';route()"><div class="flex justify-between"><span class="font-semibold">${L.pays[k]}</span><b>${k==="monthly"?money(mo):money(pr.total)}</b></div></button>`).join("")}</div><p class="muted text-xs mt-2">${L.bank}</p>`:""}
  <div class="text-sm font-semibold mt-5">${L.notes}</div>
  <div class="grid gap-2 mt-2"><input class="input" placeholder="${L.gate}" value="${esc(Q.gate)}" oninput="Q.gate=this.value"><input class="input" placeholder="${L.pets}" value="${esc(Q.pets)}" oninput="Q.pets=this.value"><textarea class="input" rows="2" placeholder="${L.other}" oninput="Q.notes=this.value">${esc(Q.notes)}</textarea></div>
  ${priceBox()}
  <div class="flex gap-2 mt-4"><button class="btn btn-ghost" onclick="Q.step=2;route()">${L.back}</button><button class="btn btn-orange flex-1" onclick="Q.step=4;route()">${L.next}</button></div>`}
 if(Q.step===4){
  body=`${priceBox()}
  ${Q.type==="biz"?`<p class="text-sm mt-3 orange font-semibold">${L.bizNote}</p>`:""}
  <details class="card p-4 mt-4 text-sm" open><summary class="cursor-pointer font-bold">${L.waiverT(b)}</summary><ol class="list-decimal pl-5 grid gap-2 mt-3 muted">${waiverLines(Q.lang).map(t=>`<li>${esc(t)}</li>`).join("")}</ol></details>
  <label class="flex gap-3 text-sm items-start mt-3"><input id="agree" type="checkbox" class="mt-1 w-5 h-5" ${Q.agree?"checked":""} onchange="Q.agree=this.checked"><span>${L.agree(b)}</span></label>
  <label class="text-sm font-semibold block mt-3">${L.sign}</label><input id="sign" class="input mt-1" style="font-family:cursive;font-size:1.2rem" value="${esc(Q.sign)}" oninput="Q.sign=this.value" placeholder="${L.name}">
  <p class="muted text-xs mt-3">${L.ai}</p>
  <div class="flex gap-2 mt-4"><button class="btn btn-ghost" onclick="Q.step=3;route()">${L.back}</button><button id="bookBtn" class="btn btn-orange flex-1" onclick="bookQuote()">${Q.type==="biz"?L.bizBook:L.book}</button></div>`}
 if(Q.step===5)body=`<div class="text-center py-6"><div class="text-5xl">✅</div><div class="display text-2xl mt-3">${Q.type==="biz"?L.bizDoneT:L.doneT}</div><p class="muted mt-2">${Q.type==="biz"?L.bizDoneS:L.doneS(o.notice)}</p>
  <p class="muted text-xs mt-3">${L.signed}: ${esc(Q.sign)} · ${new Date().toLocaleString()}</p>
  <button class="btn btn-ghost mt-5" onclick="const l=Q.lang;resetQuote();Q.lang=l;route()">${L.restart}</button></div>`;
 return `<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div class="text-xs muted">Homeowner view · what customers see after scanning the QR code</div><a href="#/route" class="underline text-sm">Back to operator view</a></div>
 <div class="max-w-xl mx-auto card p-5">
  <div class="flex justify-between items-start gap-3"><div><div class="display text-2xl">${L.title}</div><div class="muted text-sm mt-1">${L.sub(b)}</div></div>${langToggle}</div>
  ${prog}<div class="mt-4">${body}</div>
 </div>
 <div class="todo max-w-xl mx-auto mt-4">Preview: the satellite map and address search are live, but the property record is sample data and nothing is saved or charged. The real build looks up the lot size from county records, saves the signed waiver with a timestamp, and sends the booking to the operator's Customers list.</div>`;
}
function priceBoxInner(){const o=DB.op,L=QT[Q.lang],pr=priceFor(Q.zones),zn=Q.lang==="es"?ZN_ES:ZN;
 if(!pr.lines.length)return `<div class="muted text-sm">${L.needZone}</div>`;
 const extra=(Q.tall?o.tallFee:0)+(Q.freq!=="once"?o.firstCut:0);
 return `<div class="muted text-sm">${L.total}</div>
  <div class="display text-3xl mt-1">${money(pr.total)} <span class="text-base muted">${L.per}</span></div>
  <div class="grid gap-1 mt-2 text-sm">${pr.lines.map(l=>`<div class="flex justify-between"><span><span style="color:${ZCOLOR[l.zone]}">■</span> ${zn[l.zone]} · ${fmt(l.sqft)} sq ft</span><span>${money(l.price)}</span></div>`).join("")}
  ${pr.why==="minimum"?`<div class="muted text-xs">${L.min} (${money(o.minimum)})</div>`:""}</div>
  ${Q.step>=3&&extra?`<div class="text-sm mt-2 pt-2" style="border-top:1px solid var(--border)">${L.fees}: ${Q.freq!=="once"?`${L.firstCut} ${money(o.firstCut)}`:""}${Q.tall?` · ${L.tallFee} ${money(o.tallFee)}`:""}<div class="font-bold mt-1">${L.firstVisit}: ${money(pr.total+extra)}</div></div>`:""}
  ${Q.step<3?`<div class="text-xs muted mt-2">${L.fees}: ${L.firstCut.split(" (")[0]} ${money(o.firstCut)} · ${L.tallFee.split(" (")[0]} ${money(o.tallFee)}</div>`:""}`}
function parcelCard(){const L=QT[Q.lang],p=Q.parcel,tot=sqftOf(Q.zones),over=tot>p.lot-p.house;
 return `<div class="card p-3 mt-3 text-sm" style="background:var(--bg)"><div class="font-bold">${L.record}</div>
 <div class="flex flex-wrap gap-x-4 mt-1"><span>${L.lot}: <b>${fmt(p.lot)} sq ft</b> (${(p.lot/43560).toFixed(2)} acres)</span><span>${L.house}: <b>${fmt(p.house)} sq ft</b></span></div>
 ${over?`<div class="text-xs mt-1" style="color:var(--yellow)">${L.tooBig}</div>`:""}
 <div class="muted text-xs mt-1">${L.sample}</div></div>`}
function drawBar(){const L=QT[Q.lang];if(!Q.active)return "";const zn=(Q.lang==="es"?ZN_ES:ZN)[Q.active];
 return `<div class="card p-3 text-sm" style="background:var(--bg);border-color:${ZCOLOR[Q.active]}"><b>${zn}:</b> ${L.outlineHelp(zn)}
 <div class="flex flex-wrap gap-2 mt-2"><button id="finishBtn" class="btn btn-sm btn-orange" onclick="finishZone()">${L.finish} (${Q.draft.length})</button><button class="btn btn-sm btn-ghost" onclick="Q.draft.pop();redraw()">${L.undo}</button><button class="btn btn-sm btn-ghost" onclick="Q.draft=[];redraw()">${L.clear}</button></div></div>`}
function toggleZone(z){
 if(Q.active===z){Q.active=null;Q.draft=[];return route()}
 if(Q.zones[z]!==undefined){delete Q.zones[z];delete Q.polys[z];return route()}
 Q.active=z;Q.draft=[];route()}
function finishZone(){if(Q.draft.length<3){toast(QT[Q.lang].tap3);return}
 Q.polys[Q.active]=Q.draft.slice();Q.zones[Q.active]=Math.round(ringSqft(Q.draft));Q.active=null;Q.draft=[];route()}
function useEstimate(){const e=estimateZones(),keys=Object.keys(Q.zones);if(Q.active&&!keys.includes(Q.active))keys.push(Q.active);
 const use=keys.length?keys:["front","back"];use.forEach(k=>{if(!Q.polys[k])Q.zones[k]=e[k]});Q.active=null;Q.draft=[];route();toast(QT[Q.lang].estd)}
function initMap(){
 const el=$("#qmap");if(!el)return;if(!window.L){el.innerHTML='<div class="p-4 muted text-sm">Map could not load.</div>';return}
 if(MAP){try{MAP.remove()}catch(e){}MAP=null}
 MAP=L.map(el,{zoomControl:true,attributionControl:true}).setView(Q.center,Q.zoom);
 L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"}).addTo(MAP);
 MAP.on("moveend",()=>{const c=MAP.getCenter();Q.center=[c.lat,c.lng];Q.zoom=MAP.getZoom()});
 if(Q.found)L.circleMarker(Q.found,{radius:6,color:"#fff",weight:2,fillColor:"#f97316",fillOpacity:1}).addTo(MAP);
 MAP.on("click",e=>{if(Q.step===1){pickSpot(e.latlng.lat,e.latlng.lng);return}if(Q.step!==2||!Q.active)return;Q.draft.push([e.latlng.lat,e.latlng.lng]);redraw()});
 if(Q.step===2){MAP.doubleClickZoom.disable();el.classList.toggle("drawing",!!Q.active)}
 MAPLAYERS={};redraw();
}
function redraw(){if(!MAP)return;Object.values(MAPLAYERS).forEach(l=>{try{MAP.removeLayer(l)}catch(e){}});MAPLAYERS={};
 Object.entries(Q.polys).forEach(([z,pts])=>{MAPLAYERS[z]=L.polygon(pts,{color:ZCOLOR[z],weight:2,fillOpacity:.3}).addTo(MAP)});
 if(Q.active&&Q.draft.length){MAPLAYERS._d=L.polygon(Q.draft,{color:ZCOLOR[Q.active],weight:2,dashArray:"6 4",fillOpacity:.2}).addTo(MAP);
  MAPLAYERS._p=L.layerGroup(Q.draft.map(p=>L.circleMarker(p,{radius:5,color:"#fff",weight:2,fillColor:ZCOLOR[Q.active],fillOpacity:1}))).addTo(MAP)}
 const db=$("#drawBar");if(db)db.innerHTML=drawBar();const pb=$("#pbox");if(pb)pb.innerHTML=priceBoxInner();
}
const GEO="https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer";
async function geocode(v){
 try{const r=await fetch(`${GEO}/findAddressCandidates?f=json&maxLocations=1&countryCode=USA&outFields=Match_addr&singleLine=${encodeURIComponent(v)}`);const j=await r.json();const c=j.candidates&&j.candidates[0];if(c&&c.score>=80)return {ll:[c.location.y,c.location.x],label:c.address}}catch(e){}
 try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q="+encodeURIComponent(v),{headers:{"Accept":"application/json"}});const j=await r.json();if(j.length)return {ll:[Number(j[0].lat),Number(j[0].lon)],label:j[0].display_name}}catch(e){}
 return null}
async function reverseGeo(lat,lng){try{const r=await fetch(`${GEO}/reverseGeocode?f=json&location=${lng},${lat}`);const j=await r.json();return j.address&&j.address.Match_addr||""}catch(e){return ""}}
let sugT=null;
function suggestAddr(v){clearTimeout(sugT);const box=$("#addrSug");if(!box)return;if(v.trim().length<4){box.innerHTML="";return}
 sugT=setTimeout(async()=>{try{const r=await fetch(`${GEO}/suggest?f=json&countryCode=USA&maxSuggestions=5&text=${encodeURIComponent(v)}`);const j=await r.json();
  box.innerHTML=(j.suggestions||[]).map(x=>`<button class="block w-full text-left px-3 py-2 text-sm border-b" style="border-color:var(--border)" onclick="$('#addr').value=this.textContent;$('#addrSug').innerHTML='';findAddr()">${esc(x.text)}</button>`).join("")}catch(e){box.innerHTML=""}},250)}
async function findAddr(){const L_=QT[Q.lang],v=$("#addr").value.trim();Q.addr=v;if(!v)return;
 const btn=$("#findBtn");btn.textContent=L_.finding;btn.disabled=true;$("#geoMsg").textContent="";
 const g=await geocode(v);
 if(g){Q.found=g.ll;Q.center=g.ll;Q.zoom=19;Q.addr=g.label||v;Q.parcel=sampleParcel(Q.addr);Q.zones={};Q.polys={};route();return}
 $("#geoMsg").innerHTML=`<span style="color:var(--yellow)">${Q.lang==="es"?"No encontramos esa dirección. Acerque el mapa y toque su casa.":"We couldn't find that address. Zoom the map and tap your house."}</span>`;btn.textContent=L_.find;btn.disabled=false}
async function pickSpot(lat,lng){Q.found=[lat,lng];Q.center=[lat,lng];const a=await reverseGeo(lat,lng);if(a)Q.addr=a;Q.parcel=sampleParcel(Q.addr||String(lat));Q.zones={};Q.polys={};route();toast(Q.lang==="es"?"Propiedad seleccionada":"Property selected")}
function bookQuote(){const L=QT[Q.lang],o=DB.op,p=PLANS[o.plan];
 if(!Q.agree||Q.sign.trim().length<3){toast(L.needSign);return}
 if(Q.type==="home"&&Q.freq!=="once"){
  if(p.cap&&activeCount()>=p.cap){Q.step=5;route();toast("Operator note: you're at your plan limit, so this request waits in your Inbox.");return}
  DB.customers.push({id:Date.now()%100000,name:Q.sign.trim(),addr:Q.addr||"(sample address)",zones:{...Q.zones},freq:Q.freq,day:"Wed",pay:Q.pay,lang:Q.lang,notes:[Q.gate&&`Gate ${Q.gate}`,Q.pets,Q.notes].filter(Boolean).join(". "),status:"active",waiver:{signed:Q.sign.trim(),at:new Date().toISOString(),version:WAIVER_VER},lat:Q.center[0],lng:Q.center[1]});save()}
 Q.step=5;route()}

/* ===================== 6. CUSTOMER TEXTS ===================== */
function viewTexts(){
 const b=DB.op.business;
 const lib=[["English",[["AI notice (once, up front)",T.en.aiNote(b)],["Rain delay",T.en.rain("Dana",b,"Wednesday")],["On the way",T.en.omw("Dana",b)],["Done + photo link",T.en.done("Dana",b,"412 Oak Ridge Dr",photoLink(1))],["Skipped (no charge)",T.en.skip("Dana",b)],["Yearly agreement link",T.en.renew("Dana",b,renewLink({id:1}),false)],["Agreement reminder",T.en.remind("Dana",b,renewLink({id:1}))]]],
  ["Español",[["Aviso de IA (una vez)",T.es.aiNote(b)],["Retraso por lluvia",T.es.rain("Luis",b,"miércoles")],["En camino",T.es.omw("Luis",b)],["Listo + foto",T.es.done("Luis",b,"88 Willow Ct",photoLink(2))],["Visita cancelada (sin cargo)",T.es.skip("Luis",b)],["Acuerdo anual",T.es.renew("Luis",b,renewLink({id:2}),false)],["Recordatorio del acuerdo",T.es.remind("Luis",b,renewLink({id:2}))]]]];
 return shell("texts",`
 <div class="grid md:grid-cols-2 gap-4">
  ${lib.map(([lang,items])=>`<div class="card p-5"><div class="display text-lg">${lang}</div>
   <div class="rounded-2xl p-4 mt-3 grid gap-3" style="background:#fff">${items.map(([k,v])=>`<div><div class="text-[11px] text-gray-500 mb-1">${k}</div><div class="bubble in">${esc(v)}</div></div>`).join("")}</div></div>`).join("")}
 </div>
 <div class="card p-5 mt-4"><div class="display text-lg">Sent in this preview</div>
  ${DB.texts.length?`<div class="grid gap-2 mt-3">${DB.texts.map(t=>`<div class="text-sm card p-3" style="background:var(--bg)"><div class="muted text-xs">${t.at} · to ${esc(t.to)} · ${t.kind} · ${t.lang==="es"?"Español":"English"}</div><div class="mt-1">${esc(t.body)}</div></div>`).join("")}</div>`:`<p class="muted text-sm mt-2">Nothing yet. Tap buttons on <a class="underline" href="#/route">Today's route</a> to see the texts each customer would get.</p>`}
 </div>
 <div class="todo mt-4">Spanish wording is a draft and should be checked by a native speaker before launch.</div>`);
}

/* ===================== ROUTER ===================== */
function route(top){
 const h=(location.hash||"#/route").slice(2).split("?")[0]||"route";
 const v=(DB.viewAs==="crew"&&h!=="route")?viewRoute:({route:viewRoute,customers:viewCustomers,settings:viewSettings,plan:viewPlan,quote:viewQuote,texts:viewTexts,sign:()=>shellless(viewSign())})[h]||viewRoute;
 if(MAP){try{MAP.remove()}catch(e){}MAP=null}
 $("#app").innerHTML=v();if(top===true)window.scrollTo(0,0);
 if(h==="quote"&&(Q.step===1||Q.step===2))initMap();
}
const shellless=x=>x;
load();waiverSweep();addEventListener("hashchange",()=>route(true));route(true);
</script>
</body>
</html>
